<div class="list-container">

  <div class="list-header">
    <mat-form-field appearance="outline" class="buscador">
      <mat-label>Buscar</mat-label>
      <input matInput (input)="filtrar($event)" placeholder="Nombre, clave, municipio..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-flat-button (click)="abriirForm(null)">
      <mat-icon>add</mat-icon>
      Nueva escuela
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card>
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="clave">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Clave</th>
        <td mat-cell *matCellDef="let e">{{ e.clave }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let e">{{ e.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="municipio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Municipio</th>
        <td mat-cell *matCellDef="let e">{{ e.municipio ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="zonaEscolar">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Zona</th>
        <td mat-cell *matCellDef="let e">{{ e.zonaEscolar }}</td>
      </ng-container>

      <ng-container matColumnDef="nivel">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nivel</th>
        <td mat-cell *matCellDef="let e">{{ e.nivel }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let e">
          <button mat-icon-button matTooltip="Editar" (click)="abriirForm(e)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" color="warn" (click)="eliminar(e)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">
          No se encontraron escuelas
        </td>
      </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
  </mat-card>

</div>
