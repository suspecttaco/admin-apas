<div class="list-container">

  <div class="list-header">
    <button mat-flat-button (click)="abrirForm(null)">
      <mat-icon>add</mat-icon>
      Nuevo ciclo
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card>
    <table mat-table [dataSource]="ciclos()">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="fInicio">
        <th mat-header-cell *matHeaderCellDef>Inicio</th>
        <td mat-cell *matCellDef="let c">{{ c.fInicio | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="fFin">
        <th mat-header-cell *matHeaderCellDef>Fin</th>
        <td mat-cell *matCellDef="let c">{{ c.fFin | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let c">
          @if (c.activo) {
            <mat-chip color="primary" highlighted>Activo</mat-chip>
          } @else {
            <mat-chip>Inactivo</mat-chip>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          @if (!c.activo) {
            <button mat-icon-button matTooltip="Activar" (click)="activar(c)">
              <mat-icon>check_circle</mat-icon>
            </button>
          }
          <button mat-icon-button matTooltip="Editar" (click)="abrirForm(c)">
            <mat-icon>edit</mat-icon>
          </button>
          @if (!c.activo) {
            <button mat-icon-button matTooltip="Eliminar" color="warn" (click)="eliminar(c)">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">
          No hay ciclos registrados
        </td>
      </tr>

    </table>
  </mat-card>

</div>
