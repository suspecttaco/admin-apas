<div class="list-container">

  <div class="list-header">
    <button mat-flat-button (click)="abrirForm(null)">
      <mat-icon>add</mat-icon>
      Nuevo grupo
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card>
    <table mat-table [dataSource]="grupos()">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Grupo</th>
        <td mat-cell *matCellDef="let g">{{ g.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="idGrado">
        <th mat-header-cell *matHeaderCellDef>Grado</th>
        <td mat-cell *matCellDef="let g">{{ nombreGrado(g.idGrado) }}</td>
      </ng-container>

      <ng-container matColumnDef="idTurno">
        <th mat-header-cell *matHeaderCellDef>Turno</th>
        <td mat-cell *matCellDef="let g">{{ nombreTurno(g.idTurno) }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let g">
          <button mat-icon-button matTooltip="Editar" (click)="abrirForm(g)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" color="warn" (click)="eliminar(g)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">
          No hay grupos registrados
        </td>
      </tr>

    </table>
  </mat-card>

</div>
