<div class="list-container">

  <div class="list-header">
    <button mat-flat-button (click)="abrirForm(null)">
      <mat-icon>add</mat-icon>
      Nuevo turno
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card>
    <table mat-table [dataSource]="turnos()">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let t">{{ t.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="hInicio">
        <th mat-header-cell *matHeaderCellDef>Hora inicio</th>
        <td mat-cell *matCellDef="let t">{{ t.hInicio }}</td>
      </ng-container>

      <ng-container matColumnDef="hFin">
        <th mat-header-cell *matHeaderCellDef>Hora fin</th>
        <td mat-cell *matCellDef="let t">{{ t.hFin }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let t">
          <button mat-icon-button matTooltip="Editar" (click)="abrirForm(t)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" color="warn" (click)="eliminar(t)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">
          No hay turnos registrados
        </td>
      </tr>

    </table>
  </mat-card>

</div>
