<div class="list-container">

  <div class="list-header">
    <mat-form-field appearance="outline" class="buscador">
      <mat-label>Buscar</mat-label>
      <input matInput (input)="filtrar($event)" placeholder="Nombre, correo, rol..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-flat-button (click)="abrirForm(null)">
      <mat-icon>add</mat-icon>
      Nuevo usuario
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card>
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let u">{{ u.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
        <td mat-cell *matCellDef="let u">{{ u.correo }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
        <td mat-cell *matCellDef="let u">
          <mat-chip>{{ u.rol.nombre }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="escuela">
        <th mat-header-cell *matHeaderCellDef>Escuela</th>
        <td mat-cell *matCellDef="let u">{{ u.escuela?.nombre ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button matTooltip="Editar" (click)="abrirForm(u)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" color="warn" (click)="eliminar(u)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">
          No se encontraron usuarios
        </td>
      </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
  </mat-card>

</div>
