<h2 mat-dialog-title>{{ data?.id ? 'Editar nombramiento' : 'Nuevo nombramiento' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" style="padding-top: 8px; min-width: 360px;">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="100" />
      @if (form.get('nombre')?.hasError('required') && form.get('nombre')?.touched) {
        <mat-error>Requerido</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">Cancelar</button>
  <button mat-flat-button (click)="guardar()" [disabled]="cargando()">
    {{ cargando() ? 'Guardando...' : 'Guardar' }}
  </button>
</mat-dialog-actions>
