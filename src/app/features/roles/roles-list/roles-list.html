<div class="list-container">

  <div class="list-header">
    <mat-form-field appearance="outline" class="buscador">
      <mat-label>Buscar</mat-label>
      <input matInput (input)="filtrar($event)" placeholder="Nombre, descripcion..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-flat-button (click)="abrirForm(null)">
      <mat-icon>add</mat-icon>
      Nuevo rol
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card>
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let r">{{ r.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="desc">
        <th mat-header-cell *matHeaderCellDef>Descripcion</th>
        <td mat-cell *matCellDef="let r">{{ r.desc ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="requiereEscuela">
        <th mat-header-cell *matHeaderCellDef>Requiere escuela</th>
        <td mat-cell *matCellDef="let r">
          <mat-icon>{{ r.requiereEscuela ? 'check' : 'close' }}</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="permisos">
        <th mat-header-cell *matHeaderCellDef>Permisos</th>
        <td mat-cell *matCellDef="let r">{{ r.permisos.length }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button matTooltip="Asignar permisos" (click)="abrirPermisos(r)">
            <mat-icon>admin_panel_settings</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Editar" (click)="abrirForm(r)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" color="warn" (click)="eliminar(r)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell sin-datos" [attr.colspan]="columnas.length">
          No se encontraron roles
        </td>
      </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
  </mat-card>

</div>
