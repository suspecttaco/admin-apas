<h2 mat-dialog-title>{{ data?.id ? 'Editar rol' : 'Nuevo rol' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="30" />
      @if (form.get('nombre')?.hasError('required') && form.get('nombre')?.touched) {
        <mat-error>Requerido</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripcion</mat-label>
      <input matInput formControlName="desc" />
    </mat-form-field>

    <div class="campo-completo">
      <mat-checkbox formControlName="requiereEscuela">
        Requiere escuela asignada
      </mat-checkbox>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">Cancelar</button>
  <button mat-flat-button (click)="guardar()" [disabled]="cargando()">
    {{ cargando() ? 'Guardando...' : 'Guardar' }}
  </button>
</mat-dialog-actions>
